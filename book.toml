[book]
title = "Glide"
authors = ["Ari"]
language = "en"
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/glide.css"]
additional-js = ["theme/glide.js"]
git-repository-url = "https://github.com/tqwewe/glide"
edit-url-template = "https://github.com/tqwewe/glide/edit/main/{path}"
# Hide the "1." section-number prefixes in the sidebar for a cleaner look.
no-section-label = true

[output.html.search]
enable = true

[output.html.fold]
enable = true
level = 1
